[workspace]
resolver = "2"

members = [
    "crates/libs/*",
    "crates/tools/*",
]

[workspace.package]
edition = "2024"
authors = ["Breno RdV"]
repository = "https://github.com/brenordv/rusted-toolbox"
license = "GPL-3.0-only"

[workspace.dependencies]
# Internal, general: any tool may depend on these (naming rule in crates/libs/README.md)
common-audio = { path = "crates/libs/common-audio" }
common-azure = { path = "crates/libs/common-azure" }
common-cli = { path = "crates/libs/common-cli" }
common-file-utils = { path = "crates/libs/common-file-utils" }
common-gui-rune = { path = "crates/libs/common-gui-rune" }
common-logging-otel = { path = "crates/libs/common-logging-otel" }
common-mock-data = { path = "crates/libs/common-mock-data" }
common-serialization-utils = { path = "crates/libs/common-serialization-utils" }
common-signal-monitor = { path = "crates/libs/common-signal-monitor" }
common-utils = { path = "crates/libs/common-utils" }
common-utils-ext = { path = "crates/libs/common-utils-ext" }
# Internal, tool-owned: only the tool (or tool pair) in the name depends on these
dep-check-core = { path = "crates/libs/dep-check-core" }
eh-core = { path = "crates/libs/eh-core" }
eh-persistence = { path = "crates/libs/eh-persistence" }
head-tail-core = { path = "crates/libs/head-tail-core" }
seal-crypto = { path = "crates/libs/seal-crypto" }

# External
age = { version = "0.12.1", features = ["armor"] }
aho-corasick = "1.1.5"
anyhow = "1.0.105"
arboard = "3.7.0"
async-trait = "0.1.92"
azure_core = "1.2.0-beta.2"
azure_identity = "1.1.0-beta.2"
azure_messaging_eventhubs = "0.16.0"
azure_security_keyvault_secrets = "1.1.0-beta.2"
base64 = "0.23.1"
camino = "1.2.6"
cfspeedtest = "2.2.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
csv = "1.4.0"
ctrlc = "3.5.3"
dns-lookup = "4.0.2"
fake ={ version = "5.1.0", features = ["derive", "chrono"] }
filetime = "0.2.30"
futures-util = "0.3.34"
gif = "0.14.2"
globset = "0.4.22"
httpdate = "1.0.3"
hurl = "8.1.0"
hurl_core = "8.1.0"
image = "0.25.10"
imagequant = "4.4.1"
indicatif = "0.18.6"
# eh's interactive menu. Only the crossterm backend: it reuses the crossterm 0.29 eh already has.
inquire = { version = "0.9.5", default-features = false, features = ["crossterm"] }
jsonwebtoken = "12.0.0"
mime_guess = "2.0.5"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
num_cpus = "1.17.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
qrcodegen = "1.8.0"
raccoon-otel = "1.1.0"
rand = "0.10.4"
ratatui = "0.30.2"
rayon = "1.12.0"
redb = "5.0.0"
regex = "1.13.2"
# Workspace default reqwest (gitignore). netquality pins its
# own 0.12 to match cfspeedtest; see crates/tools/tool-netquality/Cargo.toml.
reqwest = { version = "0.13.5", features = ["json"] }
# Sound playback behind `common-audio`. Only the output device and the decoders for the formats
# the tools accept; on Linux the build needs the ALSA development files (`libasound2-dev`).
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
# Only for setting the process crypto provider (eh-core's `tls`); default
# features, the same set the Azure crates enable.
rustls = "0.23.46"
# Rune is pre-release and not on crates.io (the crates.io `rune` is an unrelated scripting
# language), so it is a git dependency pinned to one reviewed rev. The rev is on a fork
# (brenordv/rune, branch `c4eda05-fixes`, tag `c4eda05-fixes-2`): anomalyco/rune's dev rev
# c4eda05 plus three commits and nothing else. On Windows a dead key's character types (winit's
# `KeyEvent::text`); a multi-line field's blank line is one accessible text run holding its
# line break (upstream gives the line before the last a run shorter than its character lengths,
# and a UI Automation read of it aborts the app); and typing, deleting, or pasting in a plain
# field clears `TextEdit::is_pristine` (upstream's plain-text fast path leaves it set).
# `tooling` and `keys-overlay` stay off: they write element trees, message bodies included, to
# disk.
rune = { git = "https://github.com/brenordv/rune", rev = "6cf05a0ee0f445c25a33ceeede066b78bd73ef6a", default-features = false, features = [
    "accessibility", "dbus", "embedded-fonts", "metal-backend", "svg", "native-file-dialog",
] }
rune-kit = { git = "https://github.com/brenordv/rune", rev = "6cf05a0ee0f445c25a33ceeede066b78bd73ef6a" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
# File identity (device and inode, or volume serial and file index) for moving a tool's data
# from its old place (`common-file-utils`'s `adoption`); already in the tree through walkdir.
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The decoder behind warp's query filter; https parses the raw query string
# through it so repeated keys survive with warp's decoding semantics.
serde_urlencoded = "0.7.1"
sha256 = "1.6.0"
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.1"
warp = { version = "0.4.4", features = ["server"] }
# Windows' WinRT bindings (Microsoft's windows-rs); common-gui-rune reads the system appearance with
# `UISettings`. Features are chosen per crate.
windows = { version = "0.62.2", default-features = false }
# Write/compress path only; the default bzip2/lzma/zstd/aes surface stays off.
# The zlib-rs flate2 backend is the pure-Rust one zip's own `deflate`
# meta-feature selects; bare `deflate-flate2` leaves flate2 backend-less
# and fails to compile.
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dev dependencies
azure_core_amqp = "1.2.0-beta.3"
http-body-util = "0.1.5"
rstest = "0.29.0"
tempfile = "3.27.0"

# Rune's vendored forks, copied from Rune's root Cargo.toml at anomalyco/rune's c4eda05: Cargo
# applies a dependency's [patch] only inside that dependency's own workspace, so an app building
# Rune repeats it. The Rune fork above changes no vendored crate, so these stay on anomalyco's
# c4eda05; a fork commit that touches `vendor/` moves them to the fork's rev. [patch] applies
# to this whole workspace; the windowed tools (eh-gui, seal-gui, speak, alert) all build on
# Rune. Each fork is the crates.io crate plus Rune's committed vendor/<name>.patch:
# - winit: Windows window creation without the TaskbarList call and at the requested position;
#   a macOS IME reconversion API; Wayland touchpad scroll deltas scaled by 12.
# - wgpu-hal (30.0.1): DX12 adapter exposure, FXC loaded on first compile, partial presents on
#   a FLIP_SEQUENTIAL swap chain.
# - parley_engine: bidi rule L1, shaping caches, segmenter hooks.
# - accesskit_windows: heading and landmark properties for UI Automation.
# Every Rune bump re-diffs this table and repeats the fork review.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "c4eda05889c984fff91ccd906e3c00cdfc4cae24" }
winit = { git = "https://github.com/anomalyco/rune", rev = "c4eda05889c984fff91ccd906e3c00cdfc4cae24" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "c4eda05889c984fff91ccd906e3c00cdfc4cae24" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "c4eda05889c984fff91ccd906e3c00cdfc4cae24" }

[profile.release]
lto = true
codegen-units = 1
strip = true