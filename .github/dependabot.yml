# Watches the SHA-pinned actions in .github/workflows and opens PRs when they
# age. Crate dependencies are deliberately not listed: advisory detection runs
# in deps-audit.yml plus the repo's Dependabot alerts (alerts only; automated
# security-fix PRs stay off by owner decision), so vulnerable-crate fixes are
# applied manually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
