[package]
name = "imgx"
version = "1.2.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Quick way for editing images from the terminal"
repository = "https://github.com/brenordv/rusted-toolbox"

[dependencies]
shared = { path = "../shared" }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "color"] }
tracing = "0.1.44"
indicatif = "0.18.6"
rayon = "1.12.0"
num_cpus = "1.17.0"
image = { version = "0.25.10", features = ["png", "jpeg", "gif", "webp", "tiff", "avif"] }
gif = "0.14.2"
imagequant = { version = "4.4.1" }