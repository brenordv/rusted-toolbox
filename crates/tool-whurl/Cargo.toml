[package]
name = "whurl"
version = "1.4.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Wrapper for Hurl with a few additional features."
repository = "https://github.com/brenordv/rusted-toolbox"

[dependencies]
shared = { path = "../shared" }
hurl = { git = "https://github.com/Orange-OpenSource/hurl", tag = "8.0.1" }
hurl_core = { git = "https://github.com/Orange-OpenSource/hurl", tag = "8.0.1" }
anyhow = "1.0.103"
camino = "1.2.4"
clap = { version = "4.6.1", features = ["derive"] }
chrono = "0.4.45"
once_cell = "1.21.4"
rand = "0.10.2"
regex = "1.12.4"
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"