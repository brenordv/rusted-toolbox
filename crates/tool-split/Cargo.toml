[package]
name = "split"
version = "1.1.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Tool for splitting large UTF-8 text or CSV files by line count with header preservation, progress feedback, and graceful shutdown."
repository = "https://github.com/brenordv/rusted-toolbox"

[dependencies]
shared = { path = "../shared" }
clap = "4.6.1"
log = "0.4.33"
chrono = "0.4.45"
anyhow = "1.0.103"
tracing = "0.1.44"