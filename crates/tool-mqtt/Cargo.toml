[package]
name = "mqtt"
version = "1.1.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Tool for quickly post to or read from a MQTT topic."
repository = "https://github.com/brenordv/rusted-toolbox"

[dependencies]
shared = { path = "../shared" }
clap = "4.6.1"
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["full"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
tracing = "0.1.44"