[package]
name = "shared"
version = "1.2.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Where all shared code lives."

[features]
default = []
otel = ["raccoon-otel"]

[dependencies]
raccoon-otel = { version = "1.0.0", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4"] }
arboard = "3.6.1"
csv = "1.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
regex = "1.12.4"
futures = "0.3.32"
serde_json = "1.0.150"
ctrlc = "3.5.2"
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.0"
once_cell = "1.21.4"
memmap2="0.9.11"
dialoguer = "0.12.0"
notify="8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
dotenv = "0.15.0"

[dev-dependencies]
tempfile = "3.27.0"
rstest="0.26.1"