[package]
name = "pingx"
version = "1.1.0"
edition = "2021"
authors = ["Breno RdV"]
description = "Cross platform CLI tool to ping other hosts."
repository = "https://github.com/brenordv/rusted-toolbox"


[dependencies]
shared = { path = "../shared" }
clap = "4.6.1"
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["full"] }
# ICMP/ICMPv6 ping implementation (RFC 792/4443)
surge-ping = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dns-lookup = "3.0.1"
chrono = "0.4.45"