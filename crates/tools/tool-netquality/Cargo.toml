[package]
name = "netquality"
version = "1.1.0"
description = "Cross platform CLI tool that monitors internet connectivity and speed."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
shared = { workspace = true, features = ["otel"] }
clap = { workspace = true }
anyhow = { workspace = true }
# cfspeedtest 2.2.2 (latest) builds on reqwest 0.12 and its speed_test() takes a
# reqwest 0.12 Client, so this crate stays on 0.12 instead of the workspace's 0.13.
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
cfspeedtest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
