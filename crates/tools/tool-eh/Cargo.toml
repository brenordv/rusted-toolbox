[package]
name = "eh"
version = "2.0.0"
description = "Azure Event Hubs CLI: captures events into a local archive, exports them to txt, csv, or json, and sends events, with saved connection profiles"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Internal
common-azure = { workspace = true }
common-cli = { workspace = true }
common-mock-data = { workspace = true }
common-signal-monitor = { workspace = true }
common-utils = { workspace = true }
eh-core = { workspace = true }
eh-persistence = { workspace = true }

# External
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
inquire = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
