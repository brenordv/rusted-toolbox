[package]
name = "speak"
version = "1.0.0"
description = "Sends text to a text-to-speech server and plays the audio it answers with."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Internal
common-audio = { workspace = true }
common-cli = { workspace = true }
common-serialization-utils = { workspace = true }
common-utils = { workspace = true }

# External
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
common-audio = { workspace = true, features = ["test-support"] }

rstest = { workspace = true }
tempfile = { workspace = true }
warp = { workspace = true }
