[package]
name = "eh-gui"
version = "1.1.0"
description = "Desktop GUI for Azure Event Hubs: live capture into a local archive, archive search, export, and send, with saved connection profiles"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Dev-only demo mode: the `eh-gui-demo` binary with a generated event hub. Release builds
# (`cargo build --release --workspace`) leave it out.
demo = ["dep:tempfile"]
# Dev-only headless test harness: the test support modules and the drivers the integration
# tests share with the unit tests. Release builds leave it out.
test-harness = ["dep:tempfile", "common-gui-rune/test-harness"]

[[bin]]
name = "eh-gui-demo"
path = "src/bin/eh_gui_demo.rs"
required-features = ["demo"]

[[test]]
name = "secret_hygiene"
path = "tests/secret_hygiene.rs"
required-features = ["test-harness"]

[[test]]
name = "quit_logging"
path = "tests/quit_logging.rs"
required-features = ["test-harness"]

[dependencies]
# Internal
common-cli = { workspace = true }
common-gui-rune = { workspace = true }
common-utils = { workspace = true }
mock-data-utils = { workspace = true }
shared-eventhub-core = { workspace = true }
shared-eventhub-persistence = { workspace = true }

# External
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
rune = { workspace = true }
rune-kit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
common-gui-rune = { workspace = true, features = ["test-harness"] }
shared-azure = { workspace = true }
shared-eventhub-persistence = { workspace = true, features = ["test-support"] }

rand = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
