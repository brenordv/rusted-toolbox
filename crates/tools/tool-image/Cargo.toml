[package]
name = "imgx"
version = "2.0.0"
description = "Quick way for editing images from the terminal"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Internal
common-cli = { workspace = true }
common-file-utils = { workspace = true }
common-utils = { workspace = true }

# External
anyhow = { workspace = true }
clap = { workspace = true, features = ["color"] }
gif = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "tiff", "avif"] }
imagequant = { workspace = true }
indicatif = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }