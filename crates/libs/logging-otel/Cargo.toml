[package]
name = "logging-otel"
version = "1.1.1"
description = "Extension for the logging utilities (present in common-cli crate) that enable use of open telemetry."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
otel = ["raccoon-otel"]

[dependencies]
# Internal
common-cli = { workspace = true }

# External
raccoon-otel = { workspace = true, optional = true }